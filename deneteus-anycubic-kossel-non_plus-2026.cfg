# ====================================================================
# KLIPPER CONFIGURATION FOR ANYCUBIC KOSSEL LINEAR (NON-PLUS)
# Modified for a 200mm physical bed & 218mm factory rods.
# Mainboard: TriGorilla (AVR ATmega2560)
# Maintainer / GitHub: @Deneteus
# ====================================================================

# ====================================================================
# REQUIRED MAINSAIL INTERFACE & SYSTEM DEFINITIONS
# ====================================================================
[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[pause_resume]

[stepper_a]
step_pin: PF0
dir_pin: !PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE4
homing_speed: 60
# Safe starting baseline height. Will update automatically via calibration.
position_endstop: 220.0
# Factory-standard non-plus specification
arm_length: 218.0

[stepper_b]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ0

[stepper_c]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD2

[extruder]
step_pin: PA4
dir_pin: !PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.333
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 25.349
pid_Ki: 1.216
pid_Kd: 132.130
min_extrude_temp: 150
min_temp: 0
max_temp: 275

# ====================================================================
# HEATED BED (DISABLED)
# Original factory kit does not feature a heated bed. 
# ====================================================================
#[heater_bed]
#heater_pin: PH5
#sensor_type: EPCOS 100K B57560G104F
#sensor_pin: PK6
#control: pid
#pid_kp: 73.517
#pid_ki: 1.132
#pid_kd: 1193.728
#min_temp: 0
#max_temp: 130

[fan]
pin: PH6
kick_start_time: 0.200

[heater_fan extruder_cooler_fan]
pin: PL5

# Un-comment this block if you decide to attach your auto-leveling probe later
#[probe]
#pin: ^PD3
#z_offset: 15.9
#samples: 3

[mcu]
serial: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0

[printer]
kinematics: delta
max_velocity: 500
max_accel: 3000
max_z_velocity: 200
# Enforces safe travel path well inside your 200mm physical footprint
delta_radius: 97.5
minimum_z_position: -5

[idle_timeout]
timeout: 360

[delta_calibrate]
# Shrunk to 75 so calibration sweeps stay safely away from the 200mm edges
radius: 75

# "RepRapDiscount 2004 Smart Controller" display pins
[display]
lcd_type: hd44780
rs_pin: PH1
e_pin: PH0
d4_pin: PA1
d5_pin: PA3
d6_pin: PA5
d7_pin: PA7
encoder_pins: ^PC6, ^PC4
click_pin: ^!PC2
kill_pin: ^!PG0

[output_pin BEEPER_pin]
pin: PC0
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001

# ====================================================================
# REQUIRED MAINSAIL INTERFACE MACROS
# ====================================================================
[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    M107
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    G28
    CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    {% set X = params.X|default(0)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    PAUSE_BASE
    G91
    G1 Z{Z} F900
    G90
    G1 X{X} Y{Y} F6000

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    RESUME_BASE
    G90

# ====================================================================
# SYSTEM & UTILITY MACROS
# ====================================================================
[gcode_macro m205]
gcode:
    G4

[gcode_macro m108]
gcode:
    G4

[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=BEEPER_pin VALUE={S}
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0

[gcode_macro MacroHome]
gcode:
    G28
    M300

[gcode_macro MacroDeltaCalibrate]
gcode:
    G28
    M300
    DELTA_CALIBRATE
    M300
    G28
    M300
    SAVE_CONFIG

# ====================================================================
# PID CALIBRATION MACROS
# ====================================================================
[gcode_macro MacroPIDExtruderFanOFF200]
gcode:
    G28
    M300
    G1 X0 Y0 Z2 F3000
    M300
    M107
    PID_CALIBRATE HEATER=extruder TARGET=200
    M300
    G28
    SAVE_CONFIG

[gcode_macro MacroPIDExtruderFanOFF230]
gcode:
    G28
    M300
    G1 X0 Y0 Z2 F3000
    M300
    M107
    PID_CALIBRATE HEATER=extruder TARGET=230
    M300
    G28
    SAVE_CONFIG

[gcode_macro MacroPIDExtruderFanON200]
gcode:
    G28
    M300
    G1 X0 Y0 Z2 F3000
    M300
    M106
    PID_CALIBRATE HEATER=extruder TARGET=200
    M300
    G28
    SAVE_CONFIG

[gcode_macro MacroPIDExtruderFanON230]
gcode:
    G28
    M300
    G1 X0 Y0 Z2 F3000
    M300
    M106
    PID_CALIBRATE HEATER=extruder TARGET=230
    M300
    G28
    SAVE_CONFIG

# ====================================================================
# LIVE Z-OFFSET MACROS
# ====================================================================
[gcode_macro MacroZOffsetPlus0200]
gcode:
    SET_GCODE_OFFSET Z=0.2
    M300

[gcode_macro MacroZOffsetPlus0150]
gcode:
    SET_GCODE_OFFSET Z=0.15
    M300

[gcode_macro MacroZOffsetPlus0100]
gcode:
    SET_GCODE_OFFSET Z=0.1
    M300

[gcode_macro MacroZOffsetPlus005]
gcode:
    SET_GCODE_OFFSET Z=0.05
    M300

[gcode_macro MacroZOffset0]
gcode:
    SET_GCODE_OFFSET Z=0
    M300

[gcode_macro MacroZOffsetMinus005]
gcode:
    SET_GCODE_OFFSET Z=-0.05
    M300

[gcode_macro MacroZOffsetMinus0100]
gcode:
    SET_GCODE_OFFSET Z=-0.1
    M300

[gcode_macro MacroZOffsetMinus0150]
gcode:
    SET_GCODE_OFFSET Z=-0.15
    M300

[gcode_macro MacroZOffsetMinus0200]
gcode:
    SET_GCODE_OFFSET Z=-0.2
    M300

# ====================================================================
# NOZZLE WIPE MACRO (SAFE BOUNDS FOR 200MM BED)
# ====================================================================
[gcode_macro WIPE]
gcode:
    G1 X75 Y-50 Z0.2 F6000
    G92 E0
    G4 P2000
    G1 E10 F100
    G1 Z0.2
    G4 P2000
    G1 E10 F100
    G1 X65 Y-45 Z0.2 F4000
    G1 X65 Y-35 Z0.2 F4000
    G1 X70 Y-40 Z0.2 F4000
    G1 X75 Y-40 Z0.2 F4000
