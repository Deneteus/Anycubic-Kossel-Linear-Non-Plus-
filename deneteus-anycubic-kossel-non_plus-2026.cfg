# This file contains a modified configuration for the original "Anycubic Kossel Linear" (Non-Plus)
# adjusted for a smaller frame size and a 210mm total bed footprint.
# Mainboard: TriGorilla board (AVR ATmega2560).

[stepper_a]
step_pin: PF0
dir_pin: !PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE4
homing_speed: 60
# Shrunk from 295.6 down to standard non-plus build height baseline.
# Run DELTA_CALIBRATE to calculate your exact personalized value.
position_endstop: 220.0
# Shrunk from 269.0 down to the standard non-plus carbon rod length.
arm_length: 218.0

[stepper_b]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ0

[stepper_c]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD2

[extruder]
step_pin: PA4
dir_pin: !PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.333
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 25.349
pid_Ki: 1.216
pid_Kd: 132.130
min_extrude_temp: 150
min_temp: 0
max_temp: 275

#[heater_bed]
#heater_pin: PH5
#sensor_type: EPCOS 100K B57560G104F
#sensor_pin: PK6
#control: pid
#pid_kp: 73.517
#pid_ki: 1.132
#pid_kd: 1193.728
#min_temp: 0
#max_temp: 130

[fan]
pin: PH6
kick_start_time: 0.200

[heater_fan extruder_cooler_fan]
pin: PL5

# if you want to use your probe for DELTA_CALIBRATE you will need that
#[probe]
#pin: ^PD3
#z_offset: 15.9
#samples: 3

[mcu]
serial: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0

[printer]
kinematics: delta
max_velocity: 500
max_accel: 3000
max_z_velocity: 200
# Enforces a strict 90mm radius (180mm printable circle) over your physical 210mm plate
delta_radius: 97.5
minimum_z_position: -5

[idle_timeout]
timeout: 360

[delta_calibrate]
# Restricted from 115 down to 80 so the leveling probe stays completely inside the printable area
radius: 80

# "RepRapDiscount 2004 Smart Controller" type displays
[display]
lcd_type: hd44780
rs_pin: PH1
e_pin: PH0
d4_pin: PA1
d5_pin: PA3
d6_pin: PA5
d7_pin: PA7
encoder_pins: ^PC6, ^PC4
click_pin: ^!PC2
kill_pin: ^!PG0

########################################
# Hardware Definition Additions
########################################

[output_pin BEEPER_pin]
pin: PC0 # Default TriGorilla speaker pin mapping. Change if you use a custom screen.
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.001

########################################
# System Macros
########################################
[gcode_macro m205]
gcode: 
    G4

[gcode_macro m108]
gcode: 
    G4

[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=BEEPER_pin VALUE={S}
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0

########################################
# Home and Calibrating Macros
########################################
[gcode_macro MacroHome]
gcode:
    G28
    M300

[gcode_macro MacroDeltaCalibrate]
gcode:
    G28
    M300
    DELTA_CALIBRATE
    M300
    G28
    M300
    SAVE_CONFIG

[gcode_macro MacroPIDExtruderFanOFF200]
gcode:
    G28
    M300
    G1 X0 Y0 Z2 F3000
    M300
    M107
    PID_CALIBRATE HEATER=extruder TARGET=200
    M300
    G28
    SAVE_CONFIG

[gcode_macro MacroPIDExtruderFanOFF230]
gcode:
    G28
    M300
    G1 X0 Y0 Z2 F3000
    M300
    M107
    PID_CALIBRATE HEATER=extruder TARGET=230
    M300
    G28
    SAVE_CONFIG

[gcode_macro MacroPIDExtruderFanON200]
gcode:
    G28
    M300
    G1 X0 Y0 Z2 F3000
    M300
    M106
    PID_CALIBRATE HEATER=extruder TARGET=200
    M300
    G28
    SAVE_CONFIG

[gcode_macro MacroPIDExtruderFanON230]
gcode:
    G28
    M300
    G1 X0 Y0 Z2 F3000
    M300
    M106
    PID_CALIBRATE HEATER=extruder TARGET=230
    M300
    G28
    SAVE_CONFIG

########################################
# Offset Macros
########################################
[gcode_macro MacroZOffsetPlus0200]
gcode:
    SET_GCODE_OFFSET Z=0.2
    M300

[gcode_macro MacroZOffsetPlus0150]
gcode:
    SET_GCODE_OFFSET Z=0.15
    M300

[gcode_macro MacroZOffsetPlus0100]
gcode:
    SET_GCODE_OFFSET Z=0.1
    M300

[gcode_macro MacroZOffsetPlus005]
gcode:
    SET_GCODE_OFFSET Z=0.05
    M300

[gcode_macro MacroZOffset0]
gcode:
    SET_GCODE_OFFSET Z=0
    M300

[gcode_macro MacroZOffsetMinus005]
gcode:
    SET_GCODE_OFFSET Z=-0.05
    M300

[gcode_macro MacroZOffsetMinus0100]
gcode:
    SET_GCODE_OFFSET Z=-0.1
    M300

[gcode_macro MacroZOffsetMinus0150]
gcode:
    SET_GCODE_OFFSET Z=-0.15
    M300

[gcode_macro MacroZOffsetMinus0200]
gcode:
    SET_GCODE_OFFSET Z=-0.2
    M300

########################################
# Nozzle Wipe Macro
########################################
[gcode_macro WIPE]
gcode:
    # Adjusted endpoints down to 85mm to protect your 21cm physical bed frame bounds
    G1 X85 Y-50 Z0.2 F6000
    G92 E0
    G4 P2000
    G1 E10 F100
    G1 Z0.2
    G4 P2000
    G1 E10 F100
    G1 X70 Y-45 Z0.2 F4000
    G1 X70 Y-35 Z0.2 F4000
    G1 X75 Y-40 Z0.2 F4000
    G1 X80 Y-40 Z0.2 F4000
